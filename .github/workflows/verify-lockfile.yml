name: Actions - Verify Lockfile
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify workflow dependencies
        run: gh actions-lock --verify
